paths:
  input_file: "data/raw_data/problem_statements.xlsx"
  output_dir: "data/processed"
  chunks_file: "chunks.csv"
  cache_dir: "cache"

chunking:
  target_columns: ["Title", "Description"]
  window_size: 3

embedding:
  model_name : "sentence-transformers/msmarco-distilbert-dot-v5"
  text_column : "chunk_text"
  output_file : "embedded_problem_statements.csv"
  batch_size : 16

retrieval:
  top_k : 5